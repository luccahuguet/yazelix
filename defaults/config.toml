# Yazelix Nova semantic config.
# Native tool configs live beside this file under ~/.config/yazelix/.

[appearance]
# Product appearance projected to managed components.
mode = "dark"

[open]
# yzx-open diagnostics: off, error, info, or debug.
log_level = "info"

[shell]
# Packaged shell for new Zellij panes: nu, bash, zsh, or fish.
program = "nu"
# Use Atuin history search in new managed shells.
atuin = true

[editor]
# Editor command for managed opens. hx and yzx-hx use Nova Helix when included.
command = "yzx-hx"

[forest]
# Side where Forest renders in managed Helix: left or right.
side = "right"

[sidebar]
# "radar" keeps the managed Radar plugin. Use "yzx-yazi" for Nova's managed
# Yazi, or any other executable; put arguments in args.
command = "radar"
args = []

[agent]
# "auto" keeps the built-in provider fallback. Any other value is one executable
# command for the managed agent popup; put arguments in args.
command = "auto"
args = []

[welcome]
# Show a brief welcome splash before entering the managed runtime.
enabled = true
# Welcome style: static, logo, aquarium, boids, boids_predator, boids_schools,
# friends_and_enemies, primordial, physarum, chladni, plasma, mandelbrot, matrix,
# game_of_life_gliders, game_of_life_tumblers, or random.
# asciiquarium is a compatibility alias for the native aquarium scene.
style = "random"
# Welcome splash duration in seconds.
duration_seconds = 3

[popup]
# Left/right and top/bottom cell margins for managed popups.
side_margin = 1
vertical_margin = 0

[keybindings]
# Key chords for managed Yazelix actions. Set an action to false to leave it unmapped.
config = "Alt Shift K"
agent = "Alt Shift L"
git = "Alt Shift J"
menu = "Alt Shift M"
screen = "Alt Shift A"
sidebar = "Alt Shift H"
sidebar_focus = "Ctrl y"

# Custom popups can be added manually. Commands are argv-based, not shell strings.
# Titles default to <id>_popup and must be unique.
# [popups.btm]
# command = "btm"
# args = ["--basic"]
# title = "btm_popup"
# keybinding = "Alt Shift B"
# keep_alive = true

[bar]
# Top bar widgets, left to right. Rightmost widgets disappear first when tabs need space.
widgets = ["editor", "shell", "term", "codex_usage", "cpu", "ram"]
