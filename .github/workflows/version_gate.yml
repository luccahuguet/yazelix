name: Version Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-gate
  cancel-in-progress: false

jobs:
  release-gate:
    needs: [linux-profile-smoke, macos-package-smoke, darwin-core, darwin-editor, darwin-integration]
    if: always() && github.repository_id == '746026727'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Require every release check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          if jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context=release-gate -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Native release checks' > /dev/null
          test "$state" = success

  linux-profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          extra-conf: |
            accept-flake-config = true
            max-jobs = 2
            cores = 2

      - name: Install yzx into a temp profile
        run: |
          for package in \
            yazelix \
            yazelix-no-helix \
            yazelix-no-yazi \
            yazelix-no-helix-no-yazi; do
            profile="$RUNNER_TEMP/$package-profile"
            nix profile add --refresh "$GITHUB_WORKSPACE#$package" --profile "$profile"
            test -x "$profile/bin/yzx"
            test -f "$profile/share/applications/yzx-stable.desktop"
          done
          grep -Fqx 'Name=Yazelix Nova (Stable)' "$RUNNER_TEMP/yazelix-profile/share/applications/yzx-stable.desktop"

      - name: Build release contract checks
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.contracts \
            .#checks.x86_64-linux.desktop_channels \
            .#checks.x86_64-linux.helix_contracts \
            .#checks.x86_64-linux.host_yazi_contracts \
            .#checks.x86_64-linux.key_reference_parity \
            .#checks.x86_64-linux.rio_contracts \
            .#checks.x86_64-linux.no_rio_contracts \
            .#checks.x86_64-linux.no_helix_contracts

      - name: Smoke installed yzx commands
        run: |
          profile="$RUNNER_TEMP/yazelix-profile"
          export HOME="$RUNNER_TEMP/yazelix-home"
          export YAZELIX_CONFIG_HOME="$RUNNER_TEMP/yazelix-config"
          export YAZELIX_STATE_DIR="$RUNNER_TEMP/yazelix-state"
          export XDG_DATA_HOME="$RUNNER_TEMP/yazelix-data"
          mkdir -p "$HOME" "$YAZELIX_CONFIG_HOME" "$YAZELIX_STATE_DIR" "$XDG_DATA_HOME"

          "$profile/bin/yzx" help > "$RUNNER_TEMP/yzx-help.txt"
          "$profile/bin/yzx" status > "$RUNNER_TEMP/yzx-status.txt"
          "$profile/bin/yzx" doctor > "$RUNNER_TEMP/yzx-doctor.txt"
          "$profile/bin/yzx" tutor list > "$RUNNER_TEMP/yzx-tutor-list.txt"

          grep -F 'Yazelix Nova' "$RUNNER_TEMP/yzx-help.txt"
          grep -F 'Yazelix Nova status' "$RUNNER_TEMP/yzx-status.txt"
          grep -F "config home: $YAZELIX_CONFIG_HOME" "$RUNNER_TEMP/yzx-status.txt"
          grep -F "state dir: $YAZELIX_STATE_DIR" "$RUNNER_TEMP/yzx-status.txt"
          grep -F 'Yazelix Nova doctor' "$RUNNER_TEMP/yzx-doctor.txt"
          grep -F 'ok    Configuration    settings valid' "$RUNNER_TEMP/yzx-doctor.txt"
          grep -F 'Yazelix Nova tutor lessons' "$RUNNER_TEMP/yzx-tutor-list.txt"

      - name: Build Home Manager with newer nixpkgs
        run: |
          df -h /
          time nix build --no-link --no-write-lock-file --print-out-paths --print-build-logs \
            --override-input nixpkgs "$(cat checks/newer-nixpkgs.txt)" \
            .#checks.x86_64-linux.home_manager

  macos-package-smoke:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          extra-conf: |
            accept-flake-config = true
            max-jobs = 1
            cores = 2

      - name: Build aarch64-darwin packages and checks
        run: |
          for package in \
            yazelix \
            yazelix-no-helix \
            yazelix-no-yazi \
            yazelix-no-helix-no-yazi; do
            path="$(nix build --no-link --no-write-lock-file --print-out-paths --print-build-logs ".#packages.aarch64-darwin.$package")"
            test ! -e "$path/share/applications"
          done
          nix build --no-link --no-write-lock-file --print-build-logs \
            .#checks.aarch64-darwin.desktop_channels \
            .#checks.aarch64-darwin.home_manager \
            .#checks.aarch64-darwin.host_yazi_contracts \
            .#checks.aarch64-darwin.rio_contracts \
            .#checks.aarch64-darwin.no_helix_contracts

  darwin-core:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      STAGE_TARGET: packages.aarch64-darwin.yazelix-no-rio-no-helix-no-yazi
      CACHE_OUTPUT: "true"
    outputs: &stage-outputs
      path: ${{ steps.build.outputs.path }}
    steps: &darwin-stage-steps
      - name: Require a trusted manual release-channel run
        env:
          TRUSTED_RUN: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '746026727' && contains(fromJSON('["refs/heads/edge","refs/heads/main","refs/heads/stable"]'), github.ref) }}
        shell: bash
        run: |
          if [ "$TRUSTED_RUN" != true ]; then
            echo "::error::Darwin compatibility stages require a manual run on a canonical release channel."
            exit 1
          fi

      - name: Require cache publication credentials
        if: env.CACHE_OUTPUT == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::CACHIX_AUTH_TOKEN is required for the Darwin stage handoff."
            exit 1
          fi

      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          extra-conf: |
            accept-flake-config = true
            max-jobs = 1
            cores = 2

      - name: Configure Cachix client
        uses: cachix/cachix-action@v17
        with:
          name: yazelix
          authToken: ${{ env.CACHE_OUTPUT == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true

      - name: Restore exact prerequisite closures without building
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          jq --raw-output '.[] | .outputs.path | if type == "string" and length > 0 then . else error("Missing prerequisite output") end' <<< "$NEEDS_JSON" |
            while IFS= read -r path; do
              # Cachix omits dependencies already available from cache.nixos.org.
              nix-store --realise --max-jobs 0 --builders '' "$path"
              nix path-info --json --closure-size "$path"
            done

      - name: Build compatibility stage
        id: build
        shell: bash
        run: |
          pin="$(cat checks/newer-nixpkgs.txt)"
          printf 'Candidate: %s\nNixpkgs: %s\nTarget: %s\n' "$GITHUB_SHA" "$pin" "$STAGE_TARGET"
          df -h /
          output="$(time nix build --no-link --no-write-lock-file --print-out-paths --print-build-logs \
            --override-input nixpkgs "$pin" ".#$STAGE_TARGET")"
          test -e "$output"
          nix path-info --json --closure-size "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Publish prerequisite closure
        if: env.CACHE_OUTPUT == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          STAGE_OUTPUT: ${{ steps.build.outputs.path }}
        shell: bash
        run: cachix push yazelix "$STAGE_OUTPUT"

  darwin-editor:
    needs: darwin-core
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      STAGE_TARGET: packages.aarch64-darwin.yazelix-no-rio
      CACHE_OUTPUT: "true"
    outputs: *stage-outputs
    steps: *darwin-stage-steps

  darwin-integration:
    needs: [darwin-core, darwin-editor]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      STAGE_TARGET: checks.aarch64-darwin.home_manager
      CACHE_OUTPUT: "false"
    steps: *darwin-stage-steps
